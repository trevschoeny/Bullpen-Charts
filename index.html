<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; }
  body { font: 14px system-ui, sans-serif; background: #F1F3F0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

<body>
<!-- Bullpen Charts build 2026-09-11 · 56d425 -->
<title>Bullpen Charts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ---------- tokens: light is the base, both dark paths redefine only tokens ---------- */
:root{
  --bg:#F1F3F0; --surf:#FFFFFF; --surf2:#F7F8F5; --surf3:#EAEDE8;
  --line:#DCE0D8; --line2:#C6CCC1;
  --ink:#191E1B; --ink2:#4C5450; --ink3:#7C8681;
  --accent:#B23A2B; --accent-ink:#FFFFFF; --accent-soft:#F6E4E1;
  --good:#2C7A57; --warn:#9A6B10; --crit:#B23A2B;
  --c1:#2E6FD9; --c2:#C97C0A; --c3:#159A8C; --c4:#8B5CD6; --c5:#D4457F; --c6:#6B7580;
  --zone-line:#3D4744; --zone-fill:rgba(45,60,55,.045); --shadow-line:#B9C0B7;
  --plate:#D8DCD4;
  --heat:178,58,43;
  --shadow-sm:0 1px 2px rgba(20,28,24,.07);
  --shadow-md:0 6px 20px -8px rgba(20,28,24,.22);
  --r:10px;
  --topbar:52px;
  --disp:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1412; --surf:#161C19; --surf2:#1C2320; --surf3:#232B27;
    --line:#2B3430; --line2:#3A443F;
    --ink:#E7EDE9; --ink2:#A7B2AC; --ink3:#79837E;
    --accent:#E2604F; --accent-ink:#1A0F0D; --accent-soft:#33201C;
    --good:#4FA57F; --warn:#D2A33F; --crit:#E2604F;
    --c1:#5A8FE0; --c2:#BC8226; --c3:#22A091; --c4:#9B7DE2; --c5:#E25A8C; --c6:#8A949E;
    --zone-line:#C3CCC7; --zone-fill:rgba(200,220,210,.05); --shadow-line:#3E4A45;
    --plate:#2A322E;
    --heat:226,96,79;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 8px 24px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1412; --surf:#161C19; --surf2:#1C2320; --surf3:#232B27;
  --line:#2B3430; --line2:#3A443F;
  --ink:#E7EDE9; --ink2:#A7B2AC; --ink3:#79837E;
  --accent:#E2604F; --accent-ink:#1A0F0D; --accent-soft:#33201C;
  --good:#4FA57F; --warn:#D2A33F; --crit:#E2604F;
  --c1:#5A8FE0; --c2:#BC8226; --c3:#22A091; --c4:#9B7DE2; --c5:#E25A8C; --c6:#8A949E;
  --zone-line:#C3CCC7; --zone-fill:rgba(200,220,210,.05); --shadow-line:#3E4A45;
  --plate:#2A322E;
  --heat:226,96,79;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 8px 24px -10px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:.005em;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 64px}
.topbar{position:sticky;top:0;z-index:40;background:var(--surf);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:18px;padding-top:11px;padding-bottom:0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;padding-bottom:11px}
.seams{width:26px;height:26px;flex:0 0 auto}
.brand-name{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand-sub{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.09em;text-transform:uppercase;line-height:1;margin-top:3px}
.tabs{display:flex;gap:2px;margin-left:auto;align-self:flex-end}
.tab{background:none;border:0;padding:9px 13px 10px;font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent}
.tab:hover{color:var(--ink2)}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.notice{background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2)}
.notice .wrap{padding-top:8px;padding-bottom:8px}
.notice strong{color:var(--ink)}

/* ---------- generic ---------- */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.muted{color:var(--ink3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hidden{display:none!important}

.btn{background:var(--surf2);border:1px solid var(--line2);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surf3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-primary:hover{filter:brightness(1.07)}
.btn-sm{padding:4px 9px;font-size:13px;border-radius:7px}
.btn-ghost{background:none;border-color:transparent;color:var(--ink3)}
.btn-ghost:hover{background:var(--surf3);color:var(--ink)}
.btn-danger:hover{background:var(--accent-soft);color:var(--crit);border-color:var(--crit)}

select,input[type=text],input[type=number],input[type=date],textarea{
  background:var(--surf);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;
  font:inherit;color:var(--ink);max-width:100%}
select{cursor:pointer;padding-right:26px}
label.fld{display:flex;flex-direction:column;gap:4px}
label.fld > span{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3)}

/* ---------- pen layout ---------- */
.pen{display:grid;gap:18px;align-items:start;margin-top:18px;
  grid-template-columns:minmax(0,1fr) 340px;
  grid-template-rows:min-content auto;   /* keep the log tight under the rail */
  grid-template-areas:"zone entry" "zone log"}
.a-zone{grid-area:zone}.a-entry{grid-area:entry}.a-log{grid-area:log}
/* Stacked (tablet portrait, phone): entry controls sit ABOVE the zone so you
   never scroll between picking a pitch and tapping where it went. */
@media (max-width:900px){
  .pen{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;
    grid-template-areas:"entry" "zone" "log"}
}

.sessionbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:18px;
  background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.who{display:flex;flex-direction:column;gap:1px;min-width:0}
.who b{font-family:var(--disp);font-size:23px;font-weight:700;letter-spacing:.01em;line-height:1.05}

/* zone */
.zonewrap{position:relative;width:100%;max-width:520px;margin:0 auto}
.zonewrap canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:6px;pointer-events:none}
.zonewrap svg{position:relative;display:block;width:100%;height:auto;touch-action:manipulation}
.ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
  border:2px solid var(--accent);pointer-events:none;animation:rip .42s ease-out forwards}
@keyframes rip{from{transform:scale(.35);opacity:.95}to{transform:scale(1.15);opacity:0}}
@media (prefers-reduced-motion:reduce){.ripple{animation:none;opacity:0}}
/* Chart bar: everything that changes what the NEXT tap records, pinned within
   reach of the zone so you never scroll away mid-bullpen. */
.chartbar{position:sticky;top:calc(var(--topbar) + 4px);z-index:30;
  background:var(--surf);border-bottom:1px solid var(--line);
  margin:-16px -16px 12px;padding:11px 16px 12px;border-radius:var(--r) var(--r) 0 0;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ptrow{display:flex;gap:7px;flex-wrap:wrap}
.ptchip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;
  border:1.5px solid var(--line2);background:var(--surf2);cursor:pointer;font-size:14px;font-weight:500;
  color:var(--ink2);white-space:nowrap}
.ptchip:hover{background:var(--surf3)}
.ptchip[aria-checked="true"]{border-width:2px;padding:7px 13px;background:var(--surf3);
  color:var(--ink);font-weight:600}
.ptchip .swatch{box-shadow:0 0 0 1px var(--surf)}
.ptchip[aria-checked="false"] .swatch{background:transparent!important;border:2px solid currentColor;opacity:.65}
.ptchip kbd{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-left:1px}
.cbvelo{display:flex;align-items:center;gap:5px;margin-left:auto}
.cbvelo input{width:74px;font-family:var(--mono);font-size:18px;font-weight:500;text-align:center;padding:6px 4px}
.cbvelo button{width:34px;height:36px;border:1px solid var(--line2);background:var(--surf2);
  border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:15px;line-height:1}
.cbvelo button:hover{background:var(--surf3)}
.cbvelo .unit{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
@media (max-width:520px){.cbvelo{margin-left:0}}

.taphint{font-size:12.5px;line-height:1.45;color:var(--ink2);
  background:var(--surf2);border:1px dashed var(--line2);border-radius:8px;padding:7px 11px;margin-bottom:10px}
.taphint b{color:var(--ink)}
.viewtog{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.viewtog button{border:0;background:var(--surf2);padding:5px 11px;cursor:pointer;font-size:12.5px;
  font-weight:500;color:var(--ink3);border-right:1px solid var(--line2)}
.viewtog button:last-child{border-right:0}
.viewtog button[aria-checked="true"]{background:var(--surf3);color:var(--ink);font-weight:600}
@media (pointer:coarse){.viewtog button{padding:8px 14px;font-size:14px}}
.zone-hit{cursor:crosshair}
.armed .zone-hit{cursor:cell}
/* NOTE: font-size inside an SVG resolves in USER UNITS, not screen px —
   the zone viewBox is 100x112, so these are deliberately tiny numbers. */
.sidelabel{font-family:var(--mono);font-size:2.5px;letter-spacing:.22px;text-transform:uppercase;fill:var(--ink3)}
.zonetick{font-family:var(--mono);font-size:2.9px;fill:var(--ink3)}
/* Colors are set inline per mark so they beat these class rules — a `stroke`
   presentation attribute does NOT, which is what made balls invisible. */
.dot{stroke-width:1.4;cursor:pointer;touch-action:none}
.dragging .dot{cursor:grabbing}
.lifted .dot{stroke-width:2.6;stroke:var(--ink)!important}
.lifted{filter:drop-shadow(0 1.2px 1.6px rgba(0,0,0,.45))}
.ball-open{stroke-width:2.6}
.selring{fill:none;stroke:var(--ink);stroke-width:0.8;opacity:.9}
.grabpad{fill:transparent;cursor:grab;touch-action:none}

.editbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px;
  background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:9px 12px}
.editbar .who{font-size:13px;color:var(--ink);font-weight:600;margin-right:2px}
.editbar select,.editbar input{padding:6px 9px;font-size:13.5px;background:var(--surf)}
.editbar input[type=number]{width:76px;font-family:var(--mono);text-align:center}
.editbar .sp{margin-left:auto;display:flex;gap:7px}

/* entry rail */
.rail{display:flex;flex-direction:column;gap:12px}
.ptgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pt{display:flex;align-items:center;gap:7px;background:var(--surf2);border:1px solid var(--line);
  border-radius:8px;padding:7px 9px;cursor:pointer;text-align:left;font-size:13.5px;font-weight:500}
.pt:hover{background:var(--surf3)}
.pt[aria-pressed="true"]{border-color:var(--ink2);background:var(--surf3);box-shadow:inset 0 0 0 1px var(--ink2)}
.swatch{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.pt kbd{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.velo{display:flex;align-items:stretch;gap:6px}
.velo input{flex:1 1 auto;font-family:var(--mono);font-size:22px;font-weight:500;text-align:center;padding:4px 6px;width:100%}
.stepper{display:flex;flex-direction:column;gap:3px}
.stepper button{width:30px;flex:1;border:1px solid var(--line2);background:var(--surf2);border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:13px;line-height:1}
.stepper button:hover{background:var(--surf3)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surf);padding:11px 13px 12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--disp);font-size:29px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tile small{font-size:11.5px;color:var(--ink3)}

/* log */
.log{max-height:340px;overflow:auto;border-top:1px solid var(--line)}
.logrow{display:grid;grid-template-columns:26px auto 1fr auto 22px;gap:8px;align-items:center;
  padding:6px 12px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.logrow:hover{background:var(--surf2)}
.logrow[aria-selected="true"]{background:var(--surf3)}
.logrow .n{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:1px 7px 2px;border-radius:20px;border:1px solid var(--line2);white-space:nowrap}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;text-transform:uppercase}
.pill.s{background:var(--surf3);color:var(--good);border:1px solid currentColor}
.pill.b{background:var(--surf3);color:var(--ink3);border:1px solid var(--line2)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  text-align:right;padding:7px 10px;border-bottom:1px solid var(--line2);font-weight:500;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);align-items:center}
.legend span.k{display:inline-flex;align-items:center;gap:5px}

.empty{padding:34px 20px;text-align:center;color:var(--ink3);font-size:14px}

/* Team picker — the way in */
.pickwrap{max-width:600px;margin:0 auto;padding:52px 0 40px;text-align:center}
.pickhead{font-family:var(--disp);font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.1}
.picksub{margin:9px 0 26px;color:var(--ink3);font-size:14.5px}
.pickgrid{display:flex;flex-direction:column;gap:11px;text-align:left}
.signin{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:440px;margin:0 auto}
.signin input{flex:1 1 240px;padding:11px 13px;font-size:16px}
@media (pointer:coarse){.signin input{padding:13px}}
.teamcard{display:flex;flex-direction:column;gap:4px;background:var(--surf);border:1px solid var(--line2);
  border-left:4px solid var(--accent);border-radius:var(--r);padding:17px 20px;cursor:pointer;
  box-shadow:var(--shadow-sm);width:100%;text-align:left}
.teamcard:hover{background:var(--surf2);border-color:var(--accent)}
.tc-name{font-family:var(--disp);font-size:25px;font-weight:700;line-height:1.1}
.tc-meta{font-size:12.5px;color:var(--ink3)}
@media (pointer:coarse){.teamcard{padding:21px 20px}.tc-name{font-size:27px}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.sechead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:26px 0 10px}
.sechead h2{font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.card-list{display:flex;flex-direction:column}
.sess{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.sess:last-child{border-bottom:0}
.sess-t{font-family:var(--disp);font-size:18px;font-weight:600;line-height:1.15}
.dim{font-size:12.5px;color:var(--ink3)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surf);border:1px solid var(--line2);
  border-radius:8px;padding:7px 10px;font-size:12.5px;box-shadow:var(--shadow-md);max-width:230px}
.tip .num{font-size:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.inline-note{font-size:12.5px;color:var(--ink3);line-height:1.45}

/* ---------- in-page dialogs (browser prompt/confirm are blocked in the viewer) ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(12,18,15,.5);
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surf);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow-md);
  width:100%;max-width:400px;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.modal h3{font-size:21px;letter-spacing:.02em}
.modal p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.5}
.modal .fld input{width:100%}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px;border:1px solid var(--line2);background:var(--surf2);border-radius:9px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:2px}

/* ---------- touch / tablet ---------- */
button{touch-action:manipulation}
.zonewrap{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){
  :root{--topbar:62px}
  .ptchip{padding:11px 17px;font-size:15px}
  .ptchip[aria-checked="true"]{padding:10px 16px}
  .cbvelo button{width:42px;height:44px}
  .cbvelo input{width:84px;font-size:20px}
  .btn{padding:11px 16px}
  .btn-sm{padding:8px 12px}
  .tab{padding:12px 15px 13px;font-size:16px}
  .pt{padding:12px 11px;font-size:15px}
  .logrow{padding:11px 12px;grid-template-columns:26px auto 1fr auto 34px}
  .stepper button{width:46px}
  .velo input{font-size:26px}
  select,input[type=text],input[type=number],input[type=date]{padding:11px 12px;font-size:16px}
  input[type=checkbox]{width:19px;height:19px}
  .zonewrap{max-width:620px}
}
</style>

<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <svg class="seams" viewBox="0 0 32 32" aria-hidden="true">

        <path d="M7.5 5.5C11 10 11.5 22 7.5 26.5" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M24.5 5.5C21 10 20.5 22 24.5 26.5" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>

<main class="wrap" id="app"></main>
<div class="tip hidden" id="tip"></div>

<script>
(function(){
"use strict";

/* =======================================================================
   Domain constants — real units, catcher's view
   ======================================================================= */
var PLATE_W   = 17/12;            // 17 in = 1.4167 ft
var HALF_PL   = PLATE_W/2;
var BALL_D    = 2.9/12;           // baseball diameter, ft
var BALL_R    = BALL_D/2;
var VIEW      = {x0:-2.05, x1:2.05, z0:0.10, z1:4.70};   // plotted region, ft

var PITCH_TYPES = [
  {code:"FB", label:"Fastball",  cvar:"--c1"},
  {code:"CH", label:"Changeup",  cvar:"--c2"},
  {code:"CB", label:"Curveball", cvar:"--c3"},
  {code:"SL", label:"Slider",    cvar:"--c4"},
  {code:"2S", label:"Two-seam",  cvar:"--c5"},
  {code:"OT", label:"Other",     cvar:"--c6"}
];
var PT = {}; PITCH_TYPES.forEach(function(p){ PT[p.code]=p; });

var ZONE_PRESETS = [
  {name:"8U–10U",  bot:1.30, top:2.90},
  {name:"11U–12U", bot:1.45, top:3.10},
  {name:"13U–14U", bot:1.55, top:3.30},
  {name:"HS+",     bot:1.60, top:3.45}
];

function cssv(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function ptColor(code){ return cssv((PT[code]||PT.OT).cvar); }
/* UUIDs so ids are valid in Postgres as well as in the local and artifact
   backends. crypto.randomUUID needs a secure context; the fallback is a
   correctly-shaped v4 for the rare browser without it. */
function uid(){
  try{ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  var b=new Uint8Array(16);
  try{ crypto.getRandomValues(b); }
  catch(e){ for(var i=0;i<16;i++) b[i]=Math.floor(Math.random()*256); }
  b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
  var h=[].map.call(b,function(x){ return ("0"+x.toString(16)).slice(-2); }).join("");
  return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);
}
function isUuid(s){ return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(s||"")); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(s){ if(!s) return ""; var p=s.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function r1(n){ return Math.round(n*10)/10; }

/* strike = any part of the ball over the plate and within the zone (rulebook) */
function isStrike(p, zb, zt){
  return Math.abs(p.x) <= HALF_PL + BALL_R && p.z >= zb - BALL_R && p.z <= zt + BALL_R;
}
function missIn(p){
  if(p.tx==null||p.tz==null) return null;
  return Math.sqrt(Math.pow(p.x-p.tx,2)+Math.pow(p.z-p.tz,2))*12;
}

/* =======================================================================
   State + storage (db when granted, in-memory sample otherwise)
   ======================================================================= */
var S = {
  view:"pen", db:null, ready:false, local:false,
  teams:[], pitchers:[], sessions:[],
  teamId:null, pitcherId:null, sessionId:null,
  pitchType:"FB", velo:"", carryVelo:true, armTarget:false,
  target:null, selPitch:null,
  aPitcher:"all", aRange:"all", aTypes:null,
  persp:"catcher", picked:false, isAdmin:true,
  unsub:[]
};
try{ var sp=localStorage.getItem("bpc.persp"); if(sp==="pitcher"||sp==="catcher") S.persp=sp; }catch(e){}

function perspToggle(){
  return '<div class="viewtog" role="radiogroup" aria-label="Charting view">'+
    [["catcher","Catcher"],["pitcher","Pitcher"]].map(function(o){
      return '<button role="radio" data-persp="'+o[0]+'" aria-checked="'+(S.persp===o[0])+'">'+o[1]+'</button>';
    }).join("")+'</div>';
}
/* Describes a horizontal offset without saying "left" or "right", which would
   mean opposite things in the two views. */
function sideWord(x, hand){
  if(Math.abs(x)<0.04) return "middle";
  var armSideNeg = (hand||"R")==="R";   // stored frame: RHP arm side is negative x
  return (x<0)===armSideNeg ? "arm side" : "glove side";
}

var SAMPLE_MARK = "Sample data — replace it from the Roster tab.";

function seedLocal(){
  var tid="demo-team", p1="demo-p1", p2="demo-p2";
  S.teams = [{id:tid, name:"Sample 12U Squad", zoneBot:1.45, zoneTop:3.10, types:["FB","CH","CB"], sample:true}];
  S.pitchers = [
    {id:p1, teamId:tid, name:"A. Rivera", number:"11", throws:"R", sample:true},
    {id:p2, teamId:tid, name:"J. Doyle",  number:"7",  throws:"L", sample:true}
  ];
  var pitches=[], seq=[["FB",-0.15,2.35,58],["FB",0.30,2.10,57],["CH",-0.45,1.75,49],["FB",0.62,2.95,59],
    ["CB",0.05,1.40,44],["FB",-0.05,2.20,60],["CH",0.22,1.62,48],["FB",0.90,2.55,56],
    ["CB",-0.30,1.20,45],["FB",-0.20,2.45,59],["CH",-0.60,2.05,47],["FB",0.10,2.62,58]];
  seq.forEach(function(s,i){
    pitches.push({n:i+1, type:s[0], x:s[1], z:s[2], velo:s[3],
      tx:(i%3===0? -0.20:0.25), tz:(i%3===0? 2.30:1.90), ts:Date.now()-(seq.length-i)*40000});
  });
  S.sessions = [{id:"demo-s1", teamId:tid, pitcherId:p1, date:today(), label:"Sample side session",
    notes:"", pitches:pitches, sample:true}];
  S.teamId=tid; S.pitcherId=p1; S.sessionId="demo-s1";
}

/* --- persistence helpers ------------------------------------------------ */
function dbTeam(id){ return S.db.doc("teams/"+id); }
function dbPitcher(tid,id){ return S.db.doc("teams/"+tid+"/pitchers/"+id); }
function dbSession(id){ return S.db.doc("sessions/"+id); }

/* A write takes a moment to come back from the server. Until it does, the
   local copy is the truth — otherwise the next snapshot deletes the thing you
   just made (a brand-new session vanishing mid-bullpen is the worst version
   of this). `inflight` protects unconfirmed writes; `tombstone` stops a
   just-deleted record reappearing from a snapshot that predates the delete. */
var inflight={}, tombstone={};
function mark(id){ inflight[id]=(inflight[id]||0)+1; }
function unmark(id){ if(inflight[id]){ inflight[id]--; if(!inflight[id]) delete inflight[id]; } }
function track(id, promise){
  mark(id);
  var done=function(){ setTimeout(function(){ unmark(id); }, 1200); };
  promise.then(done, function(e){ done(); dbErr(e); });
}
/* Remote list wins, except for records this device is still writing or has
   just deleted. */
function mergeList(local, incoming){
  var byId={}, out=[];
  incoming.forEach(function(x){ if(!tombstone[x.id]) byId[x.id]=x; });
  incoming.forEach(function(x){ if(tombstone[x.id]===2) delete tombstone[x.id]; });
  Object.keys(tombstone).forEach(function(k){
    if(!incoming.some(function(x){return x.id===k;})) delete tombstone[k];
    else if(tombstone[k]===1) tombstone[k]=2;
  });
  local.forEach(function(l){ if(inflight[l.id]){ out.push(l); delete byId[l.id]; } });
  incoming.forEach(function(x){ if(byId[x.id]) out.push(byId[x.id]); });
  return out;
}

function saveTeam(t){
  if(SB) return sbSave("teams", sbTeamRow(t));
  if(S.db){ var b=Object.assign({},t); delete b.id; track(t.id, dbTeam(t.id).set(b)); } persistLocal();
}
function savePitcher(p){
  if(SB) return sbSave("pitchers", sbPitcherRow(p));
  if(S.db){ var b=Object.assign({},p); delete b.id; track(p.id, dbPitcher(p.teamId,p.id).set(b)); } persistLocal();
}
function delTeam(t){
  tombstone[t.id]=1;
  if(SB) sbDelete("teams", t.id);
  S.teams=S.teams.filter(function(x){return x.id!==t.id;});
  S.pitchers=S.pitchers.filter(function(x){return x.teamId!==t.id;});
  S.sessions=S.sessions.filter(function(x){return x.teamId!==t.id;});
  if(S.db){ dbTeam(t.id).delete().catch(dbErr); }
  if(S.teamId===t.id){ S.teamId=null; S.picked=false; S.pitcherId=null; S.sessionId=null;
    try{ localStorage.removeItem("bpc.team"); }catch(_){} }
  persistLocal(); render();
}
function delPitcher(p){
  tombstone[p.id]=1;
  if(SB) sbDelete("pitchers", p.id);
  S.pitchers=S.pitchers.filter(function(x){return x.id!==p.id;});
  if(S.db){ dbPitcher(p.teamId,p.id).delete().catch(dbErr); }
  if(S.pitcherId===p.id){ S.pitcherId=null; S.sessionId=null; }
  persistLocal(); render();
}
var saveTimers={};
var sbSaveTimers={};
function saveSession(sess, now){
  if(SB){
    var sid=sess.id;
    clearTimeout(sbSaveTimers[sid]);
    if(now){ sbSave("sessions", sbSessionRow(sess)); return; }
    sbSaveTimers[sid]=setTimeout(function(){ delete sbSaveTimers[sid]; sbSave("sessions", sbSessionRow(sess)); }, 450);
    return;
  }
  persistLocal();
  if(!S.db) return;
  var id=sess.id;
  var write=function(){
    delete saveTimers[id];
    var b=Object.assign({},sess); delete b.id;
    track(id, dbSession(id).set(b));
  };
  clearTimeout(saveTimers[id]);
  if(now){ mark(id); write(); unmark(id); return; }
  mark(id);                                  // held until the debounced write starts
  saveTimers[id]=setTimeout(function(){ unmark(id); write(); }, 450);
}
function delSession(s){
  tombstone[s.id]=1;
  if(SB){ clearTimeout(sbSaveTimers[s.id]); sbDelete("sessions", s.id); }
  clearTimeout(saveTimers[s.id]); delete saveTimers[s.id];
  S.sessions=S.sessions.filter(function(x){return x.id!==s.id;});
  if(S.db){ dbSession(s.id).delete().catch(dbErr); }
  if(S.sessionId===s.id){ S.sessionId=null; rememberSession(); }
  persistLocal(); render();
}
function persistLocal(){
  if(S.db) return;
  try{ localStorage.setItem("bpc.local", JSON.stringify({teams:S.teams,pitchers:S.pitchers,sessions:S.sessions})); }catch(e){}
}
function restoreLocal(){
  try{
    var raw=localStorage.getItem("bpc.local"); if(!raw) return false;
    var d=JSON.parse(raw);
    if(!d||!d.teams||!d.teams.length) return false;
    S.teams=d.teams; S.pitchers=d.pitchers||[]; S.sessions=d.sessions||[];
    S.teamId=S.teams[0].id; return true;
  }catch(e){ return false; }
}
function dbErr(e){
  var c=e&&e.code;
  if(c==="quota_exceeded") flash("The database is full. Delete some old sessions from the Sessions tab to log more.");
  else if(c==="revoked") flash("Saving is no longer available in this view. Copy anything you need with Export CSV.");
  else if(c==="resource_exhausted") flash("Too many writes at once — the last change may not have saved. Try again in a moment.");
  else flash("That change did not save. Check your connection and try again.");
}
var flashTimer=null;
function flash(msg){
  var n=document.getElementById("notice"), t=document.getElementById("noticetext");
  t.textContent=msg; n.classList.remove("hidden");
  clearTimeout(flashTimer); flashTimer=setTimeout(function(){ setBanner(); }, 9000);
}
function setBanner(){
  var n=document.getElementById("notice"), t=document.getElementById("noticetext");
  if(S.local){
    t.innerHTML='<strong>Working offline.</strong> Shared saving is not available in this view, so pitches are kept in this browser only. Export CSV to keep a copy.';
    n.classList.remove("hidden");
  } else n.classList.add("hidden");
}

/* =======================================================================
   Selectors
   ======================================================================= */
function team(){ return S.teams.filter(function(t){return t.id===S.teamId;})[0]||null; }
function teamPitchers(){ return S.pitchers.filter(function(p){return p.teamId===S.teamId;})
  .sort(function(a,b){return a.name.localeCompare(b.name);}); }
function pitcher(id){ return S.pitchers.filter(function(p){return p.id===(id||S.pitcherId);})[0]||null; }
function session(){ return S.sessions.filter(function(s){return s.id===S.sessionId;})[0]||null; }
function teamSessions(){ return S.sessions.filter(function(s){return s.teamId===S.teamId;})
  .sort(function(a,b){ return (b.date||"").localeCompare(a.date||"") || (b.id>a.id?1:-1); }); }
function zoneOf(t){ t=t||team(); return {bot:(t&&t.zoneBot)||1.45, top:(t&&t.zoneTop)||3.10}; }
function activeTypes(){ var t=team(); return (t&&t.types&&t.types.length)?t.types:["FB","CH","CB"]; }

/* =======================================================================
   Stats
   ======================================================================= */
function summarize(pitches, zb, zt){
  var o={n:pitches.length, strikes:0, veloN:0, veloSum:0, veloMax:null, missN:0, missSum:0, within6:0};
  pitches.forEach(function(p){
    if(isStrike(p,zb,zt)) o.strikes++;
    if(typeof p.velo==="number"&&p.velo>0){ o.veloN++; o.veloSum+=p.velo; if(o.veloMax==null||p.velo>o.veloMax) o.veloMax=p.velo; }
    var m=missIn(p); if(m!=null){ o.missN++; o.missSum+=m; if(m<=6) o.within6++; }
  });
  o.strikePct = o.n? o.strikes/o.n*100 : null;
  o.avgVelo   = o.veloN? o.veloSum/o.veloN : null;
  o.avgMiss   = o.missN? o.missSum/o.missN : null;
  o.cmdPct    = o.missN? o.within6/o.missN*100 : null;
  return o;
}

/* =======================================================================
   Zone drawing — SVG plot in real feet, catcher's view
   ======================================================================= */
var W=100, H=112;                     // svg user units for the plot box
var PADL=13, PADR=7, PADT=7, PADB=13; // room for edge labels
function sx(x){ return PADL + (x-VIEW.x0)/(VIEW.x1-VIEW.x0)*(W-PADL-PADR); }
function sy(z){ return PADT + (VIEW.z1-z)/(VIEW.z1-VIEW.z0)*(H-PADT-PADB); }
function invx(px){ return VIEW.x0 + (px-PADL)/(W-PADL-PADR)*(VIEW.x1-VIEW.x0); }
function invz(py){ return VIEW.z1 - (py-PADT)/(H-PADT-PADB)*(VIEW.z1-VIEW.z0); }

/* PERSPECTIVE.
   Every pitch is STORED in one frame — catcher's view, x positive toward the
   viewer's right, height in feet off the ground. Pitcher's view is the same
   plate seen from the other side, so it is exactly a mirror: x -> -x, height
   unchanged. Because the flip happens only where a person touches the screen
   (input) and where a mark is painted (output), a session charted from behind
   the mound and one charted from behind the catcher hold identical numbers and
   merge with no conversion. The perspective is a property of where the COACH
   is standing, not of the pitch, so it lives on the device, not in the data. */
function flipped(){ return S.persp==="pitcher"; }
function sxp(x){ return sx(flipped()? -x : x); }
function invxp(px){ var x=invx(px); return flipped()? -x : x; }

function zoneSVG(opts){
  var zb=opts.bot, zt=opts.top, hand=opts.throws||"R";
  var pitches=opts.pitches||[], showHeat=!!opts.heat;
  // Catcher's view: a RHP faces us, so his arm side is on our left. From behind
  // the mound we are looking the same way he is, so it swaps.
  var armSideLeft = (hand==="R") !== flipped();
  var x0=sx(-HALF_PL), x1=sx(HALF_PL), y1=sy(zb), y0=sy(zt);
  // Dashed line = the actual strike boundary: a ball whose CENTER is inside it
  // still clips the zone, so it is called a strike. Drawing it at exactly the
  // rule makes the call visible instead of something to guess at.
  var sh0x=sx(-HALF_PL-BALL_R), sh1x=sx(HALF_PL+BALL_R), shy1=sy(zb-BALL_R), shy0=sy(zt+BALL_R);
  var o=[];
  o.push('<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Strike zone, catcher\'s view">');
  // Tap surface goes UNDER the marks so a pointer can grab a dot to move it.
  o.push('<rect class="zone-hit" x="0" y="0" width="'+W+'" height="'+H+'" fill="transparent"/>');
  o.push('<rect x="'+sh0x+'" y="'+shy0+'" width="'+(sh1x-sh0x)+'" height="'+(shy1-shy0)+
    '" fill="none" stroke="var(--shadow-line)" stroke-width="0.5" stroke-dasharray="1.6 1.6" rx="0.6"/>');
  // zone + thirds
  o.push('<rect x="'+x0+'" y="'+y0+'" width="'+(x1-x0)+'" height="'+(y1-y0)+
    '" fill="var(--zone-fill)" stroke="var(--zone-line)" stroke-width="0.85"/>');
  for(var i=1;i<3;i++){
    var gx=x0+(x1-x0)*i/3, gy=y0+(y1-y0)*i/3;
    o.push('<line x1="'+gx+'" y1="'+y0+'" x2="'+gx+'" y2="'+y1+'" stroke="var(--zone-line)" stroke-width="0.32" opacity="0.5"/>');
    o.push('<line x1="'+x0+'" y1="'+gy+'" x2="'+x1+'" y2="'+gy+'" stroke="var(--zone-line)" stroke-width="0.32" opacity="0.5"/>');
  }
  // home plate in perspective, below the zone
  var py=sy(0.30), pw=(x1-x0)/2, cx=(x0+x1)/2;
  o.push('<path d="M '+(cx-pw)+' '+py+' L '+(cx+pw)+' '+py+' L '+(cx+pw*0.78)+' '+(py+3.4)+
    ' L '+cx+' '+(py+5.6)+' L '+(cx-pw*0.78)+' '+(py+3.4)+' Z" fill="var(--plate)" stroke="var(--line2)" stroke-width="0.4"/>');
  o.push('<text x="'+cx+'" y="'+(py+9.6)+'" text-anchor="middle" class="sidelabel">17 in plate &#183; '+
    (flipped()? 'pitcher&#8217;s view' : 'catcher&#8217;s view')+'</text>');
  // height ticks
  [1,2,3,4].forEach(function(ft){
    var yy=sy(ft);
    o.push('<line x1="'+(PADL-2.4)+'" y1="'+yy+'" x2="'+(PADL-0.6)+'" y2="'+yy+'" stroke="var(--line2)" stroke-width="0.4"/>');
    o.push('<text x="'+(PADL-3.4)+'" y="'+(yy+1.6)+'" text-anchor="end" class="zonetick">'+ft+"'"+'</text>');
  });
  // arm / glove side labels
  o.push('<text x="'+(PADL+1)+'" y="'+(PADT+3)+'" class="sidelabel">'+(armSideLeft?"Arm side":"Glove side")+'</text>');
  o.push('<text x="'+(W-PADR-1)+'" y="'+(PADT+3)+'" text-anchor="end" class="sidelabel">'+(armSideLeft?"Glove side":"Arm side")+'</text>');
  // target crosshair
  if(opts.target){
    var tx=sxp(opts.target.x), tz=sy(opts.target.z);
    o.push('<g opacity="0.95"><circle cx="'+tx+'" cy="'+tz+'" r="3.4" fill="none" stroke="var(--accent)" stroke-width="0.7" stroke-dasharray="1.4 1.2"/>'+
      '<line x1="'+(tx-5)+'" y1="'+tz+'" x2="'+(tx+5)+'" y2="'+tz+'" stroke="var(--accent)" stroke-width="0.5"/>'+
      '<line x1="'+tx+'" y1="'+(tz-5)+'" x2="'+tx+'" y2="'+(tz+5)+'" stroke="var(--accent)" stroke-width="0.5"/>'+
      '<text x="'+tx+'" y="'+(tz-6.2)+'" text-anchor="middle" class="sidelabel" style="fill:var(--accent)">Mitt</text></g>');
  }
  // miss lines for the selected pitch
  pitches.forEach(function(p){
    if(p.__sel && p.tx!=null){
      o.push('<line x1="'+sxp(p.tx)+'" y1="'+sy(p.tz)+'" x2="'+sxp(p.x)+'" y2="'+sy(p.z)+
        '" stroke="var(--ink3)" stroke-width="0.45" stroke-dasharray="1.2 1"/>');
    }
  });
  // Pitch marks: shape carries the call, hue carries the pitch type.
  // Strike = solid disc. Ball = ring on a surface-colored fill, so it stays
  // readable in both themes and on top of the heat map.
  pitches.forEach(function(p){
    var c=ptColor(p.type), st=isStrike(p,zb,zt), rr=2.5;
    var mx=sxp(p.x), my=sy(p.z);
    o.push('<g class="mark" data-i="'+p.n+'">');
    if(p.__sel) o.push('<circle class="selring" cx="'+mx+'" cy="'+my+'" r="4.3"/>');
    o.push('<circle class="dot'+(st?"":" ball-open")+'" data-i="'+p.n+'" cx="'+mx+'" cy="'+my+
      '" r="'+rr+'" style="'+(st? 'fill:'+c+';stroke:var(--surf)' : 'fill:var(--surf);stroke:'+c)+'"/>');
    // Fingers are bigger than the mark — a generous invisible grab target.
    if(opts.grab) o.push('<circle class="grabpad" data-i="'+p.n+'" cx="'+mx+'" cy="'+my+'" r="5.4"/>');
    o.push('</g>');
  });
  o.push('</svg>');
  return o.join("");
}

/* Kernel-density heat map painted under the zone lines */
function paintHeat(canvas, pitches){
  if(!canvas) return;
  var box=canvas.getBoundingClientRect();
  var cw=Math.max(60,Math.round(box.width)), ch=Math.max(60,Math.round(box.height));
  var dpr=Math.min(2, window.devicePixelRatio||1);
  canvas.width=cw*dpr; canvas.height=ch*dpr;
  var ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!pitches.length) return;
  var GX=64, GY=72, grid=new Float32Array(GX*GY), max=0;
  var bw=0.24; // bandwidth in feet — about one baseball plus a little
  var fl=flipped();
  var pts=pitches.map(function(p){ return [fl? -p.x : p.x, p.z]; });
  for(var j=0;j<GY;j++){
    var gz = VIEW.z1 - (j+0.5)/GY*(VIEW.z1-VIEW.z0);
    for(var i=0;i<GX;i++){
      var gx = VIEW.x0 + (i+0.5)/GX*(VIEW.x1-VIEW.x0), s=0;
      for(var k=0;k<pts.length;k++){
        var dx=(gx-pts[k][0])/bw, dz=(gz-pts[k][1])/bw, d2=dx*dx+dz*dz;
        if(d2<9) s+=Math.exp(-0.5*d2);
      }
      grid[j*GX+i]=s; if(s>max) max=s;
    }
  }
  if(max<=0) return;
  // Paint the field into a low-res buffer, then let the browser scale it
  // smoothly — drawing cells directly leaves visible alpha seams.
  var rgb=(cssv("--heat")||"178,58,43").split(",").map(Number);
  var off=document.createElement("canvas"); off.width=GX; off.height=GY;
  var octx=off.getContext("2d"), img=octx.createImageData(GX,GY), d=img.data;
  for(var n=0;n<GX*GY;n++){
    var v=grid[n]/max;
    v = v<0.05 ? 0 : Math.pow(v,0.75);
    d[n*4]=rgb[0]; d[n*4+1]=rgb[1]; d[n*4+2]=rgb[2]; d[n*4+3]=Math.round(v*185);
  }
  octx.putImageData(img,0,0);
  var lx=PADL/W*canvas.width, rx=(W-PADR)/W*canvas.width;
  var ty=PADT/H*canvas.height, by=(H-PADB)/H*canvas.height;
  ctx.save(); ctx.beginPath(); ctx.rect(lx,ty,rx-lx,by-ty); ctx.clip();
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
  ctx.drawImage(off,0,0,GX,GY,0,0,canvas.width,canvas.height);
  ctx.restore();
}

/* =======================================================================
   Views
   ======================================================================= */
function render(){
  // A snapshot from another coach (or our own save) must not rebuild the DOM
  // out from under a finger that is mid-drag — it would detach the mark being
  // moved and silently drop the gesture. Defer to the end of the drag.
  if(S.dragging){ S.renderPending=true; return; }
  S.renderPending=false;
  var app=document.getElementById("app");
  Array.prototype.forEach.call(document.querySelectorAll("#tabs .tab"), function(b){
    b.setAttribute("aria-current", b.dataset.view===S.view ? "true":"false");
  });
  var tabs=document.getElementById("tabs");
  if(SB && !S.authed){
    tabs.classList.add("hidden");
    app.innerHTML = S.sentTo ? viewSent() : viewSignIn();
    var f=document.getElementById("signinForm");
    if(f) f.addEventListener("submit", function(e){
      e.preventDefault();
      var v=document.getElementById("signinEmail").value.trim();
      if(v) sbSendLink(v);
    });
    return;
  }
  if(!S.ready){ tabs.classList.add("hidden");
    app.innerHTML='<div class="panel pad empty" style="margin-top:24px">Loading your teams…</div>'; return; }
  if(!S.picked && S.teams.length){ tabs.classList.add("hidden"); app.innerHTML=viewPicker(); afterRender(); return; }
  tabs.classList.remove("hidden");
  if(S.view==="pen") app.innerHTML=viewPen();
  else if(S.view==="sessions") app.innerHTML=viewSessions();
  else if(S.view==="analytics") app.innerHTML=viewAnalytics();
  else app.innerHTML=viewRoster();
  afterRender();
}

/* The team is chosen once, on the way in, and scopes everything after it.
   This is scoping, not access control — anyone who can open the page can
   switch teams. It exists so a coach sees only their own club's work. */
function selTeamHTML(){
  var t=team();
  return '<div class="who"><span class="eyebrow">Team</span><b>'+esc(t?t.name:"—")+'</b></div>'+
    '<button class="btn btn-sm btn-ghost" data-act="switchteam">Switch</button>';
}
/* An iPad reloads background tabs on its own, and a bullpen can sit idle
   between arms. Remember which session is open so a reload drops the coach
   back into it rather than at "Start bullpen". */
function rememberSession(){
  try{ localStorage.setItem("bpc.session", S.sessionId||""); }catch(e){}
}
function restoreSession(){
  if(!S.picked || S.sessionId) return;
  var id=null; try{ id=localStorage.getItem("bpc.session"); }catch(e){}
  if(!id) return;
  var s=S.sessions.filter(function(x){ return x.id===id && x.teamId===S.teamId; })[0];
  if(s){ S.sessionId=s.id; S.pitcherId=s.pitcherId; }
}
function pickTeam(id, remember){
  S.teamId=id; S.picked=true; S.pitcherId=null; S.sessionId=null; S.selPitch=null; S.aPitcher="all";
  if(remember!==false){ try{ localStorage.setItem("bpc.team", id); }catch(e){} }
  if(SB){ S.staff=null; sbLoadTeam(id); sbSubscribe(id); sbLoadStaff(id); return; }
  subscribeTeam();
}

/* ---------- ANALYTICS ---------- */
/* Counted in bullpens, not days — a pitcher who threw four pens in three weeks
   and one who threw four in three months are both "his last four". Empty
   sessions never consume a slot. The pitcher filter applies BEFORE the count,
   so "last 5" means his last 5, not the team's. */
function analyticsSessions(){
  var list=teamSessions().filter(function(s){
    if(S.aPitcher!=="all" && s.pitcherId!==S.aPitcher) return false;
    return (s.pitches||[]).length>0;
  });
  if(S.aRange!=="all") list=list.slice(0, parseInt(S.aRange,10));
  return list;                                  // newest first
}
function analyticsPitches(){
  var z=zoneOf(), out=[];
  analyticsSessions().forEach(function(s){
    s.pitches.forEach(function(p){
      if(S.aTypes && S.aTypes.indexOf(p.type)<0) return;
      out.push(Object.assign({}, p, {sessionId:s.id, date:s.date, pitcherId:s.pitcherId}));
    });
  });
  return {pitches:out, z:z};
}
function viewAnalytics(){
  if(!S.teams.length) return '<div class="panel pad empty" style="margin-top:24px">Add a team on the Roster tab first.</div>';
  var ps=teamPitchers(), r=analyticsPitches(), z=r.z, all=r.pitches;
  var sessList=analyticsSessions(), nSess=sessList.length;
  var span = nSess ? (nSess===1 ? fmtDate(sessList[0].date)
              : fmtDate(sessList[nSess-1].date)+" – "+fmtDate(sessList[0].date)) : "";
  var sum=summarize(all,z.bot,z.top);
  var types=activeTypes();
  var handed = S.aPitcher==="all" ? "R" : ((pitcher(S.aPitcher)||{}).throws||"R");

  var filters='<div class="sessionbar">'+selTeamHTML()+
    '<label class="fld"><span>Pitcher</span><select id="aPitcher"><option value="all"'+(S.aPitcher==="all"?" selected":"")+'>All pitchers</option>'+
      ps.map(function(p){return '<option value="'+p.id+'"'+(S.aPitcher===p.id?" selected":"")+'>'+esc(p.name)+'</option>';}).join("")+
    '</select></label>'+
    '<label class="fld"><span>Bullpens</span><select id="aRange">'+
      [["all","All bullpens"],["3","Last 3"],["5","Last 5"],["10","Last 10"],["15","Last 15"]].map(function(o){
        return '<option value="'+o[0]+'"'+(S.aRange===o[0]?" selected":"")+'>'+o[1]+'</option>';}).join("")+
    '</select></label>'+
    '<div class="grow"></div>'+perspToggle()+
    '<span class="dim num">'+all.length+' pitches · '+nSess+' bullpen'+(nSess===1?'':'s')+'</span></div>';

  var tiles='<div class="tiles" style="margin-top:18px">'+
    tile(sum.n,"Pitches", span||"nothing logged yet")+
    tile(sum.strikePct==null?"—":Math.round(sum.strikePct)+"%","Strike rate","rulebook zone + ball width")+
    tile(sum.avgVelo==null?"—":r1(sum.avgVelo),"Avg velo",sum.veloMax==null?"no velo logged":"top "+r1(sum.veloMax)+" mph")+
    tile(sum.avgMiss==null?"—":r1(sum.avgMiss)+'"',"Avg miss",sum.missN?"over "+sum.missN+" pitches with a mitt set":"no mitt set on these bullpens")+
  '</div>';

  var rows=types.map(function(c){
    var sub=all.filter(function(p){return p.type===c;});
    if(!sub.length) return null;

function afterRender(){

    bindZone(wrap, {

/* A tap logs a pitch; a drag is a page scroll and must not. Track each pointer
   separately so a palm resting on the tablet can't swallow the finger's tap,
   and keep the thresholds generous — a real finger rolls and lingers. */
var lastFire=0, lastReject=0, gestureGuard=null;
/* Any pointer gesture on the zone — tap, hold, drag — owns the DOM until it
   finishes. A background refresh that re-rendered mid-gesture would replace the
   SVG, orphan the listeners holding this gesture's state, and drop it silently.
   Renders queue in render() and flush when the finger comes up. */
function beginGesture(){
  S.dragging=true;
  clearTimeout(gestureGuard);
  gestureGuard=setTimeout(endGesture, 5000);   // never stall renders forever
}
function endGesture(){
  clearTimeout(gestureGuard); gestureGuard=null;
  S.dragging=false;
  if(S.renderPending) render();
}

function bindZone(wrap, handlers){
  var svg=wrap.querySelector("svg"), live={}, drag=null;
  function toUser(clientX, clientY){
    var r=svg.getBoundingClientRect();
    var px=(clientX-r.left)/r.width*W, py=(clientY-r.top)/r.height*H;
    // Clamp rather than reject. The plot has a margin for the height ticks and
    // the plate caption; a pitch in the dirt or way off the plate lands there,
    // and silently dropping it is worse than recording it at the edge.
    // invxp folds the perspective back out, so what gets stored is always
    // catcher's-view coordinates no matter which side the coach is standing on.
    return { x:Math.round(Math.max(VIEW.x0, Math.min(VIEW.x1, invxp(px)))*1000)/1000,
             z:Math.round(Math.max(VIEW.z0, Math.min(VIEW.z1, invz(py)))*1000)/1000 };
  }
  function fire(clientX, clientY){
    var u=toUser(clientX, clientY);
    lastFire=Date.now();
    ripple(wrap, clientX, clientY);
    handlers.log(u.x, u.z);
  }
  function markAt(target){
    return target && target.closest ? target.closest(".mark") : null;
  }
  // Moving a pitch must be deliberate: press and HOLD a dot to pick it up.
  // A quick tap always logs a new pitch, even on top of an existing mark —
  // logging is the common action and must never be stolen by an edit.
  var HOLD_MS=450, HOLD_SLOP=10;
  svg.addEventListener("pointerdown", function(e){
    var g=markAt(e.target);
    var st={x:e.clientX, y:e.clientY, t:Date.now(), timer:null};
    live[e.pointerId]=st;
    beginGesture();
    if(g && handlers.move){
      st.timer=setTimeout(function(){
        st.timer=null;
        drag={g:g, n:+g.dataset.i, moved:false, pos:null, id:e.pointerId};
        wrap.classList.add("dragging");
        liftMark(wrap, g);
        try{ svg.setPointerCapture(e.pointerId); }catch(_){}
        try{ if(navigator.vibrate) navigator.vibrate(18); }catch(_){}
      }, HOLD_MS);
    }
  });
  svg.addEventListener("pointermove", function(e){
    var st=live[e.pointerId];
    // A finger that travels before the hold completes is scrolling, not editing.
    if(st && st.timer && Math.abs(e.clientX-st.x)+Math.abs(e.clientY-st.y) > HOLD_SLOP){
      clearTimeout(st.timer); st.timer=null;
    }
    if(!drag || e.pointerId!==drag.id) return;
    drag.moved=true;
    var u=toUser(e.clientX, e.clientY);
    drag.pos=u;
    Array.prototype.forEach.call(drag.g.children, function(c){
      c.setAttribute("cx", sx(u.x)); c.setAttribute("cy", sy(u.z));
    });
  });
  function endDrag(commit, e){
    var d=drag; drag=null; wrap.classList.remove("dragging");
    try{ svg.releasePointerCapture(e.pointerId); }catch(_){}
    if(!d) return;
    if(commit && d.moved && d.pos) handlers.move(d.n, d.pos.x, d.pos.z);
    else handlers.select(d.n);   // held, then released in place: open it for editing
  }
  function clearHold(id){
    var st=live[id]; if(st && st.timer){ clearTimeout(st.timer); st.timer=null; }
    delete live[id]; return st;
  }
  svg.addEventListener("pointercancel", function(e){
    clearHold(e.pointerId);
    if(drag && e.pointerId===drag.id) endDrag(false, e);
    endGesture();
  });
  svg.addEventListener("pointerup", function(e){
    var st=clearHold(e.pointerId);
    if(drag && e.pointerId===drag.id){ lastFire=Date.now(); endDrag(true, e); endGesture(); return; }
    endGesture();
    if(!st) return;
    var moved=Math.abs(e.clientX-st.x)+Math.abs(e.clientY-st.y);
    if(moved>22 || Date.now()-st.t>2000){ lastReject=Date.now(); return; }
    fire(e.clientX, e.clientY);
  });
  // Fallback: some browsers swallow pointerup on a framed page. A click that
  // did not follow an accepted or rejected pointer gesture still counts.
  svg.addEventListener("click", function(e){
    var now=Date.now();
    if(now-lastFire<600 || now-lastReject<600) return;
    fire(e.clientX, e.clientY);
  });
}
/* Picked-up state: the mark grows and the hint says what is happening, so a
   pitch never moves without the person knowing they picked it up. */
function liftMark(wrap, g){
  g.classList.add("lifted");
  var d=g.querySelector(".dot"); if(d) d.setAttribute("r","3.8");
  var card=wrap.parentNode, hint=card&&card.querySelector(".taphint");
  if(hint) hint.innerHTML='<b>Moving pitch #'+esc(g.dataset.i)+'</b> — drag to reposition, release to drop it. '+
    'Release without moving to open it for editing.';
}
function ripple(wrap, clientX, clientY){
  var r=wrap.getBoundingClientRect();
  var d=document.createElement("span");
  d.className="ripple";
  d.style.left=(clientX-r.left)+"px"; d.style.top=(clientY-r.top)+"px";
  wrap.appendChild(d);
  setTimeout(function(){ d.remove(); }, 450);
}

/* ---------- dialogs ---------- */
var modalEl=null;
function closeModal(){ if(modalEl){ modalEl.remove(); modalEl=null; } }
function openModal(cfg){
  closeModal();
  var scrim=document.createElement("div"); scrim.className="scrim";
  var fields=(cfg.fields||[]);
  scrim.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(cfg.title)+'">'+
    '<h3>'+esc(cfg.title)+'</h3>'+
    (cfg.body? '<p>'+cfg.body+'</p>' : '')+
    fields.map(function(f,i){
      if(f.type==="segment"){
        return '<div class="fld"><span class="eyebrow">'+esc(f.label)+'</span><div class="seg" data-seg="'+i+'">'+
          f.options.map(function(o){ return '<button type="button" data-val="'+esc(o.value)+'" aria-pressed="'+
            (o.value===f.value)+'">'+esc(o.label)+'</button>'; }).join("")+'</div></div>';
      }
      return '<label class="fld"><span>'+esc(f.label)+'</span><input type="'+(f.type||"text")+'" data-f="'+i+'" '+
        (f.placeholder?'placeholder="'+esc(f.placeholder)+'" ':'')+'value="'+esc(f.value||"")+'"></label>';
    }).join("")+
    '<div class="modal-actions"><button class="btn" data-x="cancel">Cancel</button>'+
    '<button class="btn '+(cfg.danger?'btn-primary':'btn-primary')+'" data-x="ok">'+esc(cfg.submitLabel||"Save")+'</button></div></div>';
  document.body.appendChild(scrim); modalEl=scrim;

  var vals=fields.map(function(f){ return f.value||""; });
  scrim.addEventListener("click", function(e){
    if(e.target===scrim){ closeModal(); return; }
    var sb=e.target.closest("[data-seg] button");
    if(sb){ var gi=+sb.parentNode.dataset.seg;
      Array.prototype.forEach.call(sb.parentNode.children,function(c){ c.setAttribute("aria-pressed", c===sb?"true":"false"); });
      vals[gi]=sb.dataset.val; return; }
    var x=e.target.closest("[data-x]"); if(!x) return;
    if(x.dataset.x==="cancel"){ closeModal(); return; }
    submit();
  });
  function submit(){
    fields.forEach(function(f,i){
      if(f.type==="segment") return;
      var el=scrim.querySelector('[data-f="'+i+'"]'); vals[i]=el?el.value.trim():"";
    });
    if(cfg.require!=null && !vals[cfg.require]){
      var el2=scrim.querySelector('[data-f="'+cfg.require+'"]'); if(el2) el2.focus(); return;
    }
    closeModal(); cfg.onSubmit(vals);
  }
  scrim.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ e.stopPropagation(); closeModal(); }
    else if(e.key==="Enter" && e.target.tagName==="INPUT"){ e.preventDefault(); submit(); }
  });
  var first=scrim.querySelector("input, .seg button, [data-x]"); if(first) first.focus();
}
function askConfirm(title, body, okLabel, onYes){
  openModal({title:title, body:body, fields:[], submitLabel:okLabel, danger:true, onSubmit:onYes});
}

function onZoneTap(x,z){
  if(S.armTarget){ S.target={x:x,z:z}; S.armTarget=false; render(); return; }
  var sess=session(); if(!sess) return;
  var v=parseFloat(document.getElementById("velo") ? document.getElementById("velo").value : S.velo);
  var pitch={ n:(sess.pitches.length? sess.pitches[sess.pitches.length-1].n+1 : 1),
    type:S.pitchType, x:x, z:z, ts:Date.now(),
    velo:(isFinite(v)&&v>0? Math.round(v*10)/10 : null),
    ev:(S.persp==="pitcher"?"P":"C"),   // which side it was charted from, for the audit trail
    tx:S.target?S.target.x:null, tz:S.target?S.target.z:null };
  sess.pitches.push(pitch);
  S.selPitch=pitch.n;
  if(!S.carryVelo){ S.velo=""; } else { S.velo = pitch.velo!=null? String(pitch.velo):""; }
  saveSession(sess);
  render();
}

function findPitch(n){
  var sess=session(); if(!sess) return null;
  return sess.pitches.filter(function(p){ return p.n===n; })[0]||null;
}
function movePitch(n,x,z){
  var p=findPitch(n); if(!p) return;
  p.x=x; p.z=z; S.selPitch=n;
  saveSession(session()); render();
}
function undoLast(){
  var sess=session(); if(!sess||!sess.pitches.length) return;
  sess.pitches.pop(); S.selPitch=null; saveSession(sess,true); render();
}

/* tooltips on pitch dots */
function bindTooltips(){
  var tip=document.getElementById("tip");
  // Touch devices have no hover: a tap on the zone logs a pitch, and pitch
  // detail is read from the log rows instead.
  if(!window.matchMedia || !window.matchMedia("(hover:hover)").matches){ tip.classList.add("hidden"); return; }
  Array.prototype.forEach.call(document.querySelectorAll(".zonewrap circle.dot"), function(el){
    el.addEventListener("pointerenter", function(e){
      var wrapEl=el.closest(".zonewrap"), n=+el.dataset.i, p;
      if(wrapEl && wrapEl.id==="zonewrap"){ p=findPitch(n); }        // by pitch number
      else { p=analyticsPitches().pitches[n-1]; }                    // by draw order
      if(!p) return;
      var z=zoneOf(), m=missIn(p);
      tip.innerHTML='<b>#'+n+' '+esc((PT[p.type]||PT.OT).label)+'</b><br>'+
        '<span class="num">'+(p.velo? p.velo+' mph · ':'')+(isStrike(p,z.bot,z.top)?'Strike':'Ball')+'</span>'+
        (m!=null? '<br><span class="num">'+r1(m)+' in off the mitt</span>':'');
      tip.classList.remove("hidden");
      tip.style.left=Math.min(window.innerWidth-240,e.clientX+12)+"px";
      tip.style.top=Math.max(8,e.clientY-46)+"px";
    });
    el.addEventListener("pointerleave", function(){ tip.classList.add("hidden"); });
  });
}

/* =======================================================================
   CSV export
   ======================================================================= */
function csvFor(sessions){
  var z=zoneOf();
  // Every x is catcher's-view (positive = viewer's right) regardless of the
  // view it was charted from, so rows from different coaches are directly
  // comparable. charted_from records which side the coach stood on.
  var head=["date","team","pitcher","throws","pitch_no","pitch_type","velo_mph",
    "loc_x_in_catcher_view","loc_height_in","mitt_x_in_catcher_view","mitt_height_in",
    "miss_in","call","charted_from","session_label"];
  var rows=[head.join(",")];
  sessions.forEach(function(s){
    var p=pitcher(s.pitcherId), t=S.teams.filter(function(x){return x.id===s.teamId;})[0];
    s.pitches.forEach(function(q){
      var m=missIn(q);
      rows.push([ s.date, q0(t?t.name:""), q0(p?p.name:""), p?p.throws:"",
        q.n, q.type, q.velo==null?"":q.velo,
        r1(q.x*12), r1(q.z*12),
        q.tx==null?"":r1(q.tx*12), q.tz==null?"":r1(q.tz*12),
        m==null?"":r1(m), isStrike(q,z.bot,z.top)?"strike":"ball",
        q.ev==="P"?"pitcher view":"catcher view", q0(s.label||"") ].join(","));
    });
  });
  return rows.join("\n");
}
function q0(s){ s=String(s==null?"":s); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }

function exportCSV(sessions, filename){
  if(!sessions.length || !sessions.some(function(s){return s.pitches.length;})){
    flash("There are no pitches to export yet."); return;
  }
  var text=csvFor(sessions);
  if(S.downloads){
    S.downloads.save({filename:filename, data:text}).catch(function(e){
      var c=e&&e.code;
      if(c==="declined") return;
      if(c==="rate_limited") flash("A download prompt is already open. Finish it, then export again.");
      else fallbackDownload(text, filename);
    });
  } else fallbackDownload(text, filename);
}
function fallbackDownload(text, filename){
  try{
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));
    a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },0);
  }catch(e){ flash("Downloads are blocked in this view — copy the data from the tables instead."); }
}

/* Backup / restore.
   When the page runs without a shared database every pitch lives in this one
   browser, where clearing site data erases it. A file the coach controls is
   the only real safety net, and it doubles as the way to move a season onto a
   new iPad. Restore MERGES by id, so importing the same file twice is safe. */
function exportBackup(){
  var data={ format:"bullpen-charts", version:1, exportedAt:new Date().toISOString(),
    teams:S.teams, pitchers:S.pitchers, sessions:S.sessions };
  var name="bullpen-charts-backup-"+today()+".json";
  var text=JSON.stringify(data,null,1);
  if(S.downloads){
    S.downloads.save({filename:name, data:text}).catch(function(e){
      if(e&&e.code==="declined") return;
      fallbackDownload(text,name);
    });
  } else fallbackDownload(text,name);
}
function importBackup(file){
  var rd=new FileReader();
  rd.onerror=function(){ flash("That file could not be read. Pick the .json backup again."); };
  rd.onload=function(){
    var d;
    try{ d=JSON.parse(rd.result); }catch(e){ flash("That is not a Bullpen Charts backup — the file is not valid JSON."); return; }
    if(!d || d.format!=="bullpen-charts" || !Array.isArray(d.teams)){
      flash("That file is not a Bullpen Charts backup."); return;
    }
    var have={}, added={t:0,p:0,s:0}, remap={};
    // Postgres keys are uuids; a backup from the local or Claude-hosted version
    // can carry ids like "sample-12u", so rewrite those and keep the links.
    var needUuid=!!SB;
    var fix=function(id){
      if(!needUuid || isUuid(id)) return id;
      if(!remap[id]) remap[id]=uid();
      return remap[id];
    };
    S.teams.forEach(function(x){ have[x.id]=1; });
    S.pitchers.forEach(function(x){ have[x.id]=1; });
    S.sessions.forEach(function(x){ have[x.id]=1; });
    (d.teams||[]).forEach(function(t){
      t=Object.assign({}, t, {id:fix(t.id)});
      if(have[t.id]) return; have[t.id]=1; S.teams.push(t); saveTeam(t); added.t++; });
    (d.pitchers||[]).forEach(function(p){
      if(!p.teamId) return;
      p=Object.assign({}, p, {id:fix(p.id), teamId:fix(p.teamId)});
      if(have[p.id]) return; have[p.id]=1; S.pitchers.push(p); savePitcher(p); added.p++; });
    (d.sessions||[]).forEach(function(s){
      s=Object.assign({}, s, {id:fix(s.id), teamId:fix(s.teamId),
        pitcherId:s.pitcherId?fix(s.pitcherId):null, pitches:s.pitches||[]});
      if(have[s.id]) return; have[s.id]=1; S.sessions.push(s); saveSession(s,true); added.s++; });
    persistLocal();
    flash("Restored "+added.t+" team"+(added.t===1?"":"s")+", "+added.p+" pitcher"+(added.p===1?"":"s")+
      " and "+added.s+" bullpen"+(added.s===1?"":"s")+". Anything already here was left alone.");
    render();
  };
  rd.readAsText(file);
}
function csvName(s){ var p=pitcher(s.pitcherId); return slug((p?p.name:"pitcher")+"-"+(s.date||""))+"-bullpen.csv"; }
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"bullpen"; }

function subscribeTeam(){
  if(!S.db) return;
  S.unsub.filter(function(u){return u.scope==="team";}).forEach(function(u){ u.fn(); });
  S.unsub=S.unsub.filter(function(u){return u.scope!=="team";});
  if(!S.teamId) return;
  var tid=S.teamId;
  S.unsub.push({scope:"team", fn:S.db.collection("teams/"+tid+"/pitchers").onSnapshot(function(snap){
    var incoming=snap.docs.map(function(d){ return Object.assign({id:d.id, teamId:tid}, d.data()); });
    var mine=S.pitchers.filter(function(p){return p.teamId===tid;});
    S.pitchers = S.pitchers.filter(function(p){return p.teamId!==tid;}).concat(mergeList(mine, incoming));
    if(!pitcher()) { var ps=teamPitchers(); S.pitcherId=ps.length?ps[0].id:null; }
    render();
  }, dbErr)});
  S.unsub.push({scope:"team", fn:S.db.collection("sessions").where("teamId","==",tid).limit(400)
    .onSnapshot(function(snap){
      var incoming=snap.docs.map(function(d){
        var s=Object.assign({id:d.id}, d.data()); s.pitches=s.pitches||[]; return s; });
      var mine=S.sessions.filter(function(s){return s.teamId===tid;});
      S.sessions = S.sessions.filter(function(s){return s.teamId!==tid;}).concat(mergeList(mine, incoming));
      restoreSession();
      render();
    }, dbErr)});
}

/* =======================================================================
   Supabase backend — shared data across coaches and devices.
   Active only when config.js supplies a project; otherwise the app runs
   exactly as before (Claude's shared store, or this browser alone).
   Access is enforced by row level security in Postgres, so the publishable
   key below is safe in a static page: it grants nothing on its own.
   ======================================================================= */
var SBCFG = (typeof window!=="undefined" && window.BULLPEN_CONFIG) || null;
var SB = null, SBUSER = null, sbChannels = [];

function sbTeamRow(t){ return { id:t.id, name:t.name, zone_bot:t.zoneBot, zone_top:t.zoneTop,
  types:t.types||["FB","CH","CB"], created_by:SBUSER?SBUSER.id:null }; }
function sbPitcherRow(p){ return { id:p.id, team_id:p.teamId, name:p.name,
  number:p.number||"", throws:p.throws||"R" }; }
function sbSessionRow(s){ return { id:s.id, team_id:s.teamId, pitcher_id:s.pitcherId||null,
  date:s.date, label:s.label||"", notes:s.notes||"", pitches:s.pitches||[],
  created_by:SBUSER?SBUSER.id:null }; }
function fromTeamRow(r){ return { id:r.id, name:r.name, zoneBot:r.zone_bot, zoneTop:r.zone_top,
  types:r.types||["FB","CH","CB"] }; }
function fromPitcherRow(r){ return { id:r.id, teamId:r.team_id, name:r.name,
  number:r.number||"", throws:r.throws||"R" }; }
function fromSessionRow(r){ return { id:r.id, teamId:r.team_id, pitcherId:r.pitcher_id,
  date:r.date, label:r.label||"", notes:r.notes||"", pitches:r.pitches||[] }; }

function sbSave(table, row){
  mark(row.id);
  SB.from(table).upsert(row).then(function(res){
    setTimeout(function(){ unmark(row.id); }, 800);
    if(res.error) sbErr(res.error, "save");
  });
}
function sbDelete(table, id){
  SB.from(table).delete().eq("id", id).then(function(res){
    if(res.error) sbErr(res.error, "delete");
  });
}
function sbErr(e, what){
  var m=(e&&e.message)||"";
  if(/row-level security|permission/i.test(m)){
    flash("You do not have access to change that. Ask whoever owns the team to add you.");
  } else if(/JWT|token|session/i.test(m)){
    flash("Your sign-in expired. Reload the page and sign in again.");
  } else {
    flash("That "+what+" did not reach the server. Check your connection — your work is still on screen.");
  }
}

function sbLoadTeams(){
  return SB.from("teams").select("*").order("name").then(function(r){
    if(r.error){ sbErr(r.error,"load"); return; }
    S.teams=(r.data||[]).map(fromTeamRow);
  });
}
function sbLoadTeam(tid){
  return Promise.all([
    SB.from("pitchers").select("*").eq("team_id",tid),
    SB.from("sessions").select("*").eq("team_id",tid).order("date",{ascending:false}).limit(400)
  ]).then(function(res){
    if(res[0].error||res[1].error){ sbErr(res[0].error||res[1].error,"load"); return; }
    S.pitchers=S.pitchers.filter(function(p){return p.teamId!==tid;})
      .concat((res[0].data||[]).map(fromPitcherRow));
    S.sessions=S.sessions.filter(function(s){return s.teamId!==tid;})
      .concat((res[1].data||[]).map(fromSessionRow));
    if(!pitcher()){ var ps=teamPitchers(); S.pitcherId=ps.length?ps[0].id:null; }
    restoreSession();
    render();
  });
}
/* Live updates. A row this device is mid-write on is left alone, same rule as
   the artifact backend: unconfirmed local state wins until the write lands. */
function sbSubscribe(tid){
  sbChannels.forEach(function(c){ try{ SB.removeChannel(c); }catch(e){} });
  sbChannels=[];
  var ch=SB.channel("team-"+tid)
    .on("postgres_changes", {event:"*", schema:"public", table:"sessions", filter:"team_id=eq."+tid},
      function(m){ sbApply("sessions", m); })
    .on("postgres_changes", {event:"*", schema:"public", table:"pitchers", filter:"team_id=eq."+tid},
      function(m){ sbApply("pitchers", m); })
    .subscribe();
  sbChannels.push(ch);
}
function sbApply(table, msg){
  var row=msg.new && msg.new.id ? msg.new : msg.old;
  if(!row || !row.id) return;
  var id=row.id;
  if(inflight[id]) return;                       // our own unconfirmed write
  var list = table==="sessions" ? S.sessions : S.pitchers;
  var conv = table==="sessions" ? fromSessionRow : fromPitcherRow;
  var idx=-1; for(var i=0;i<list.length;i++){ if(list[i].id===id){ idx=i; break; } }
  if(msg.eventType==="DELETE"){
    if(idx>=0) list.splice(idx,1);
    if(table==="sessions" && S.sessionId===id){ S.sessionId=null; rememberSession(); }
  } else {
    var obj=conv(msg.new);
    if(idx>=0) list[idx]=obj; else list.push(obj);
  }
  render();
}

      render();

}

}

function viewSignIn(){
  return '<div class="pickwrap">'+
    '<h1 class="pickhead">Sign in to Bullpen Charts</h1>'+
    '<p class="picksub">Enter the email your coaching staff invited. We send a one-tap link — no password to remember or share.</p>'+
    '<form class="signin" id="signinForm">'+
      '<input type="email" id="signinEmail" placeholder="you@example.com" autocomplete="email" required aria-label="Email address">'+
      '<button class="btn btn-primary" type="submit">Email me a link</button>'+
    '</form>'+
    '<p class="inline-note" style="margin-top:14px">'+
      'If nothing arrives in a minute, check spam. The link signs in the device you open it on, so open it on the tablet you chart with.</p>'+
  '</div>';
}
function sbSendLink(email){
  SB.auth.signInWithOtp({ email:email, options:{ emailRedirectTo:window.location.href } })
    .then(function(r){
      if(r.error){ flash(r.error.message||"That link could not be sent. Try again in a moment."); return; }
      S.sentTo=email; render();
    });
}
function viewSent(){
  return '<div class="pickwrap">'+
    '<h1 class="pickhead">Check your email</h1>'+
    '<p class="picksub">A sign-in link is on its way to <b>'+esc(S.sentTo)+'</b>. Open it on this device.</p>'+
    '<button class="btn" data-act="signinback">Use a different address</button></div>';
}

function bootSupabase(){
  SB = window.supabase.createClient(SBCFG.url, SBCFG.anonKey, {
    auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
  });
  S.backend="supabase";
  SB.auth.getSession().then(function(r){
    sbSetUser(r && r.data && r.data.session ? r.data.session.user : null);
  });
  SB.auth.onAuthStateChange(function(evt, sess){
    var u=sess?sess.user:null;
    if((u&&u.id)!==(SBUSER&&SBUSER.id)) sbSetUser(u);
  });
}
function sbSetUser(u){
  SBUSER=u;
  S.authed=!!u; S.sentTo=null; S.ready=true;
  if(!u){ S.teams=[]; S.pitchers=[]; S.sessions=[]; S.picked=false; render(); return; }
  // Claim any invites waiting on this address. Needed on EVERY sign-in, not
  // just the first: an existing account invited to a second team would
  // otherwise never see it. Also writes the profile row.
  SB.rpc("is_app_admin").then(function(r){ S.isAdmin = r && r.data === true; },
                              function(){ S.isAdmin = false; });
  SB.rpc("claim_invites").then(function(){ return sbLoadTeams(); }, function(){ return sbLoadTeams(); })
    .then(function(){
    var saved=null; try{ saved=localStorage.getItem("bpc.team"); }catch(e){}
    if(saved && S.teams.some(function(t){return t.id===saved;})) pickTeam(saved, false);
    render();
  });
}

/* Stamped by build.py at deploy time so you can tell at a glance which build a
   device is actually running — the offline cache means an iPad can be a
   version behind. Left untouched when the file runs unbuilt. */
var BUILD = "2026-09-11 · 56d425";
if(BUILD.charAt(0)==="_") BUILD="";

function boot(){
  if(BUILD){
    var bs=document.getElementById("brandsub");
    if(bs){ bs.textContent="Build "+BUILD; bs.title="The version this device is running"; }
  }
  if(SBCFG && SBCFG.url && SBCFG.anonKey && window.supabase){ bootSupabase(); return; }
  render();
  Promise.resolve(window.claude && window.claude.use ? window.claude.use("downloads") : null)
    .then(function(d){ S.downloads=d||null; }).catch(function(){ S.downloads=null; });

  Promise.resolve(window.claude && window.claude.use ? window.claude.use("db") : null)
    .then(function(db){
      if(!db){ startLocal(); return; }
      S.db=db;
      db.collection("teams").onSnapshot(function(snap){
        var incoming=snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        S.teams = mergeList(S.teams, incoming)
          .sort(function(a,b){ return String(a.name||"").localeCompare(String(b.name||"")); });
        if(!S.ready){
          S.ready=true;
          var saved=null; try{ saved=localStorage.getItem("bpc.team"); }catch(e){}
          if(saved && S.teams.some(function(t){return t.id===saved;})) pickTeam(saved, false);
        } else if(S.picked && !team()){ S.picked=false; S.teamId=null; }
        setBanner(); render();
      }, function(e){ dbErr(e); startLocal(); });
      setTimeout(function(){ if(!S.ready){ startLocal(); } }, 8000);
    })
    .catch(function(){ startLocal(); });
}
function startLocal(){
  if(S.ready && !S.local) return;
  S.local=true; S.db=null;
  if(!restoreLocal()) seedLocal();
  S.picked=false; S.sessionId=null;
  var saved=null; try{ saved=localStorage.getItem("bpc.team"); }catch(e){}
  if(saved && S.teams.some(function(t){return t.id===saved;})){ pickTeam(saved, false); restoreSession(); }
  S.ready=true; setBanner(); render();
}
S.heat=false;
boot();
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* non-fatal */ });
  });
}
